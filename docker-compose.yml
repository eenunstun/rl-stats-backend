services:
  postgres:
    image: postgres:16-alpine
    container_name: rl_stats_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-rl_stats_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rl_stats_pgdata:/var/lib/postgresql/data
      # Init scripts run only on first boot (when the data volume is empty).
      # Filename order matters: 01 before 02.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-rl_stats_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rl_stats_pgdata:
