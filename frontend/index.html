<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rocket-league-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RLstats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              rlblack: "#121214",
              rldark: "#1a1b1e",
              rlsurface: "#16171a",
              rlborder: "#2e303a",
              rlpurple: "#9d4edd",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            boxShadow: {
              purple: "0 0 25px rgba(157, 78, 237, 0.4)",
              "purple-lg": "0 0 40px rgba(157, 78, 237, 0.6)",
              "purple-inner": "inset 0 0 0 1px rgba(157,78,237,0.4)",
            },
            backgroundImage: {
              "rl-gradient":
                "linear-gradient(135deg, #1a1b1e 0%, #121214 100%)",
            },
            animation: {
              "fade-up": "fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both",
              "tab-slide": "tabSlide 0.4s cubic-bezier(.4,0,.2,1) forwards",
            },
            keyframes: {
              fadeUp: {
                "0%": { opacity: "0", transform: "translateY(24px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              tabSlide: {
                "0%": {
                  opacity: "0",
                  transform: "translateX(15px)",
                  filter: "blur(4px)",
                },
                "100%": {
                  opacity: "1",
                  transform: "translateX(0)",
                  filter: "blur(0)",
                },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-rlblack text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
